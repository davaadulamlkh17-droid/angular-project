<div class="student-form">
  <h3>{{ isEditing ? 'Edit Student' : 'Add New Student' }}</h3>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Name:</label>
      <input type="text" [(ngModel)]="student.name" name="name" required>
    </div>

    <div class="form-group">
      <label>Email:</label>
      <input type="email" [(ngModel)]="student.email" name="email" required>
    </div>

    <div class="form-group">
      <label>Age:</label>
      <input type="number" [(ngModel)]="student.age" name="age" required min="16" max="100">
    </div>

    <div class="form-group">
      <label>Grade:</label>
      <select [(ngModel)]="student.grade" name="grade" required>
        <option value="">Select</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="F">F</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit">{{ isEditing ? 'Update' : 'Add' }}</button>
      <button type="button" (click)="onCancel()">Cancel</button>
    </div>
  </form>
</div>
